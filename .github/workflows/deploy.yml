name: Deploy to production

# Pushing to main rebuilds and restarts the site on the Hetzner box.
# See DEPLOY.md for how the server is wired up.

on:
  push:
    branches: [main]
    # Docs-only changes don't need a rebuild.
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# Never let two deploys rebuild the same image at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart on the server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY deposu sirri tanimli degil. Bkz. DEPLOY.md"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key is pinned rather than scanned, so a hijacked DNS record
          # cannot get this key to authenticate against someone else's box.
          cat > ~/.ssh/known_hosts <<'EOF'
          62.238.105.156 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMhpXkbyvURnEX3E+5p1QY9F0lHjbvQUfxJFIGy2BW0z
          EOF
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger deploy
        run: |
          # The key is restricted server-side with command="/opt/aka/deploy.sh",
          # so connecting is what runs the deploy — no command is sent here.
          ssh -T -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              root@62.238.105.156

      - name: Verify the site is serving the new build
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://akasoftware.com.tr/ || true)
            if [ "$code" = "200" ]; then
              echo "akasoftware.com.tr yanit veriyor (HTTP 200)"
              exit 0
            fi
            echo "deneme $i: HTTP $code — tekrar denenecek"
            sleep 6
          done
          echo "::error::Site deploy sonrasi 200 dondurmedi"
          exit 1
