services:
  - type: web
    name: aka-software
    runtime: node
    plan: starter
    buildCommand: ASTRO_DATABASE_FILE=./.astro/astro.db npm install && ASTRO_DATABASE_FILE=./.astro/astro.db npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASTRO_DATABASE_FILE
        value: /data/astro.db
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TO
        sync: false
    disk:
      name: aka-data
      mountPath: /data
      sizeGB: 1
